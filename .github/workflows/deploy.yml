name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Pull Vercel production settings
        run: npx --yes vercel@59.23.2 pull --project prj_FOUc7PQmhQFUspcV9WKGJN0JtXzk --scope juane3 --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: npx --yes vercel@59.23.2 build --prod

      - name: Deploy to production
        run: npx --yes vercel@59.23.2 deploy --prebuilt --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
